[project]
name = "pubmed-hybrid-retrieval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Meghan Yee", email = "meghacoda@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "fastembed>=0.9.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "qdrant-client>=1.19.1",
    "transformers>=5.19.0",
]

[project.scripts]
pubmed-hybrid-retrieval = "pubmed_hybrid_retrieval:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
